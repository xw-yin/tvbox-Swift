name: Build and Package TVBox

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (Unsigned IPA)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Verify JavaScriptCore Spider runtime
        run: |
          swiftc tvbox/Services/Spider/DrpyRuntime.swift scripts/spider-dom/JavaScriptCoreSmoke.swift -o /tmp/tvbox-js-smoke
          /tmp/tvbox-js-smoke

      - name: Build and Package iOS IPA
        run: |
          chmod +x scripts/package-unsigned.sh
          ./scripts/package-unsigned.sh || (cat build/*.log 2>/dev/null && exit 1)

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-iOS-IPA
          path: "*.ipa"
          if-no-files-found: error

  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Free Disk Space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /Applications/Xcode_15*.app /Applications/Xcode_16.0.app /Applications/Xcode_16.1.app 2>/dev/null || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/* 2>/dev/null || true
          echo "Disk space after cleaning:"
          df -h

      - name: Build and Package macOS DMG
        run: |
          chmod +x package_mac.sh
          ./package_mac.sh

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-macOS
          path: |
            TVBox-macOS.dmg
            TVBox-macOS.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-ios, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: TVBox-iOS-IPA
          path: release-assets

      - name: Download macOS App
        uses: actions/download-artifact@v4
        with:
          name: TVBox-macOS
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
